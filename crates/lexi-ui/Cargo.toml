[package]
name = "lexi-ui"
description = "CyberLexi GPUI frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "cyberlexi"
path = "src/main.rs"

[dependencies]
lexi-core = { path = "../lexi-core" }
gpui-kit = "0.8.0"
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
smol = "2"

[build-dependencies]
# Windows-only: embed icon + version resource into cyberlexi.exe (no-op elsewhere).
# Already present transitively in the lockfile; pinned to the resolved 3.x line.
embed-resource = "3.0"
