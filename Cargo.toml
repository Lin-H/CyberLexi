[workspace]
resolver = "2"
members = ["crates/lexi-core", "crates/lexi-ui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["CyberLexi"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
async-trait = "0.1"
toml = "0.8"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI 编译慢，开发期给底层 UI 依赖提优化等级（gpui-kit 官方建议）
[profile.dev.package."gpui-pre"]
opt-level = 3
[profile.dev.package."taffy"]
opt-level = 3
[profile.dev.package."rustybuzz"]
opt-level = 3
